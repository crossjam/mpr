[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "mpr"
version = "0.1.0"
description = "Content, configuration, and tools for the Mass Programming Resistance blog"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Brian M. Dennis" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.1",
    "dulwich>=1.2.21",
    "markdown>=3.7",
    "merge3>=1.0.0",
    "pagefind[bin]>=1.3.0",
    "pelican>=4.11.0",
    "pelican-drafts>=0.1.1",
    "pelican-yaml-metadata>=2.1.2",
    "pyembed",
    "pyembed-markdown>=1.1.0",
    "pypandoc>=1.17",
    "python-slugify>=9.1.3",
    "setuptools>=76.0.0",
    "smartypants>=2.0.1",
    "typogrify>=2.1.0",
]

[project.scripts]
post = "mpr.cli:cli"

[tool.uv.sources]
pyembed = { path = "vendor/pyembed" }
pyembed-markdown = { path = "vendor/pyembed-markdown" }

[tool.uv]
override-dependencies = [
    "pygments>=2.20.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.7.3",
    "poethepoet>=0.32.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty>=0.0.100",
]

[tool.pytest.ini_options]
# anyio's plugin is pulled in by a dependency, unused here, and warns on every run
addopts = ["-p", "no:anyio"]

[tool.ruff]
line-length = 100

[tool.bandit]
# The scripts shell out to git with fixed argument lists and no shell
skips = ["B404", "B603", "B607"]

[tool.poe.env]
INPUT_DIR = "content"
OUTPUT_DIR = "output"
DEV_OUTPUT_DIR = "devoutput"
CONF_FILE = "pelicanconf.py"
PUBLISH_CONF = "publishconf.py"
SSH_HOST = "pirateninja-websites.exe.xyz"
SSH_PORT = "22"
SSH_USER = "exedev"
SSH_TARGET_DIR = "/var/www/crossjam.net/html/wp/mpr/"

[tool.poe.tasks.html]
help = "(Re)generate the web site"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
pelican "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$CONF_FILE" $OPTS
"""
  [[tool.poe.tasks.html.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.html.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"

[tool.poe.tasks.clean]
help = "Remove the generated output directory"
shell = 'rm -rf "$OUTPUT_DIR"'

[tool.poe.tasks.bandit]
help = "Scan the repository's own Python code for security issues"
shell = 'bandit -q -c pyproject.toml -r *.py src plugins vendor/pyembed/pyembed vendor/pyembed-markdown/pyembed'

[tool.poe.tasks.lint]
help = "Lint the post CLI and its tests with ruff"
cmd = "ruff check src tests"

[tool.poe.tasks.format]
help = "Format the post CLI and its tests with ruff"
cmd = "ruff format src tests"

[tool.poe.tasks.typecheck]
help = "Type-check the post CLI and its tests with ty"
cmd = "ty check src tests"

[tool.poe.tasks.test]
help = "Run the test suite"
cmd = "pytest -q"

[tool.poe.tasks.qa]
help = "Run every code check: format, lint, types, security, tests"
sequence = [
  { cmd = "ruff format --check src tests" },
  "lint",
  "typecheck",
  "bandit",
  "test",
]

[tool.poe.tasks.regenerate]
help = "Regenerate files upon modification"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
pelican -r "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$CONF_FILE" $OPTS
"""
  [[tool.poe.tasks.regenerate.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.regenerate.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"

[tool.poe.tasks.serve]
help = "Serve site at http://localhost:8000 (use --port to override)"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
[ "$PORT" != "0" ] && OPTS="$OPTS -p $PORT"
pelican -l "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$CONF_FILE" $OPTS
"""
  [[tool.poe.tasks.serve.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.serve.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"
  [[tool.poe.tasks.serve.args]]
  name = "PORT"
  options = ["--port", "-p"]
  default = "0"
  help = "Port to serve on"

[tool.poe.tasks.serve-global]
help = "Serve (as root) to SERVER:80 (use --server to override, default 0.0.0.0)"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
[ "$PORT" != "0" ] && OPTS="$OPTS -p $PORT"
pelican -l "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$CONF_FILE" $OPTS -b "$SERVER"
"""
  [[tool.poe.tasks.serve-global.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.serve-global.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"
  [[tool.poe.tasks.serve-global.args]]
  name = "PORT"
  options = ["--port", "-p"]
  default = "0"
  help = "Port to serve on"
  [[tool.poe.tasks.serve-global.args]]
  name = "SERVER"
  options = ["--server", "-b"]
  default = "0.0.0.0"
  help = "Address to bind to"

[tool.poe.tasks.devserver]
help = "Serve and regenerate together (use --port to override)"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
[ "$PORT" != "0" ] && OPTS="$OPTS -p $PORT"
pelican -lr "$INPUT_DIR" -o "$DEV_OUTPUT_DIR" -s "$CONF_FILE" $OPTS
"""
  [[tool.poe.tasks.devserver.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.devserver.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"
  [[tool.poe.tasks.devserver.args]]
  name = "PORT"
  options = ["--port", "-p"]
  default = "0"
  help = "Port to serve on"

[tool.poe.tasks.devserver-global]
help = "Serve and regenerate together (as root) to SERVER:80"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
[ "$PORT" != "0" ] && OPTS="$OPTS -p $PORT"
pelican -lr "$INPUT_DIR" -o "$DEV_OUTPUT_DIR" -s "$CONF_FILE" $OPTS -b "$SERVER"
"""
  [[tool.poe.tasks.devserver-global.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.devserver-global.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"
  [[tool.poe.tasks.devserver-global.args]]
  name = "PORT"
  options = ["--port", "-p"]
  default = "0"
  help = "Port to serve on"
  [[tool.poe.tasks.devserver-global.args]]
  name = "SERVER"
  options = ["--server", "-b"]
  default = "0.0.0.0"
  help = "Address to bind to"

[tool.poe.tasks.publish]
help = "Generate using production settings and build the search index"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
pelican "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$PUBLISH_CONF" $OPTS
python -m pagefind --site "$OUTPUT_DIR"
"""
  [[tool.poe.tasks.publish.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.publish.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"

[tool.poe.tasks.ssh_upload]
help = "Generate using production settings and upload the web site via SSH"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
pelican "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$PUBLISH_CONF" $OPTS
python -m pagefind --site "$OUTPUT_DIR"
scp -P "$SSH_PORT" -r "$OUTPUT_DIR"/* "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
"""
  [[tool.poe.tasks.ssh_upload.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.ssh_upload.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"

[tool.poe.tasks.rsync_upload]
help = "Generate using production settings and upload the web site via rsync+ssh"
shell = """
set -e
OPTS=""
[ "$DEBUG" = "1" ] && OPTS="$OPTS -D"
[ "$RELATIVE" = "1" ] && OPTS="$OPTS --relative-urls"
pelican "$INPUT_DIR" -o "$OUTPUT_DIR" -s "$PUBLISH_CONF" $OPTS
python -m pagefind --site "$OUTPUT_DIR"
if [ -n "$SSH_KEY" ]; then
  rsync -e "ssh -i $SSH_KEY -p $SSH_PORT" -P -rvzcO --cvs-exclude --delete "$OUTPUT_DIR"/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
else
  rsync -e "ssh -p $SSH_PORT" -P -rvzcO --cvs-exclude --delete "$OUTPUT_DIR"/ "$SSH_USER@$SSH_HOST:$SSH_TARGET_DIR"
fi
"""
  [[tool.poe.tasks.rsync_upload.args]]
  name = "DEBUG"
  default = "0"
  help = "Set to 1 to enable Pelican debug output"
  [[tool.poe.tasks.rsync_upload.args]]
  name = "RELATIVE"
  default = "0"
  help = "Set to 1 to enable relative urls"
  [[tool.poe.tasks.rsync_upload.args]]
  name = "SSH_KEY"
  default = ""
  help = "Path to an SSH private key to use for rsync"
